# Minimum delay between repeating actions (chat messages, emotes etc)
# 重复动作（聊天消息、表情等）的最小延迟
Playerbots.RepeatDelay = 2000

# Delay timers
# 延迟计时器
Playerbots.ErrorDelay = 100

Playerbots.RpgDelay = 10000

Playerbots.SitDelay = 20000

# ReturnDelay has a minimum value of 2000 - lower values will cause a crash!
# ReturnDelay 的最小值为 2000 - 更低的值会导致崩溃！
