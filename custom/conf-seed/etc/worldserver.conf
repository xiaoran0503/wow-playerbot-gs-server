#    CHARACTER DELETE
#    CHARACTER CREATION
#    CHARACTER
#    ACHIEVEMENT
#    SKILL
#    STATS
#    REPUTATION
#    EXPERIENCE
#    CURRENCY
#    DURABILITY
#    DEATH
#    PET
#    ITEM DELETE
#    ITEM
#    QUEST
#    CREATURE
#    VENDOR
#    GROUP
#    INSTANCE
#    DUNGEON AND BATTLEGROUND FINDER
#    CHARTER
#    GUILD
