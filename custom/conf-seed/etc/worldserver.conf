Metric.Enable = 0

#
#    Metric.InfluxDB
#        说明：InfluxDB 连接设置。（自行补译）
#        InfluxDB v1：只需填写 Metric.InfluxDB.Connection。
#        示例：         Metric.InfluxDB.Connection = "hostname;port;database"
#        InfluxDB v2：需填写全部字段。
#        注意：        目前提供的 json 文件无法配合 Grafana 可视化 InfluxDB v2 的数据。
#        示例：         Metric.InfluxDB.Connection = "hostname;port"
#                         Metric.InfluxDB.v2 =         0 - （禁用）
#                                                      1 - （启用）
#                         Metric.InfluxDB.Org =        "my-org"
#                         Metric.InfluxDB.Bucket =     "my-bucket"
#                         Metric.InfluxDB.Token =      "my-token"

Metric.InfluxDB.Connection = "127.0.0.1;8086;worldserver"
Metric.InfluxDB.v2 = 0
Metric.InfluxDB.Org = ""
Metric.InfluxDB.Bucket = ""
Metric.InfluxDB.Token = ""

#
#    Metric.Interval
#        说明：用于指定每批数据发送的时间间隔（以秒为单位）。
