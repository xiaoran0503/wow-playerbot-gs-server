# DYNAMIC RESPAWN SETTINGS
#
#
#    Respawn.DynamicRateCreature
#        Description: 控制生物重生时间基于区域玩家数量动态调整。
#                     玩家数量在配置值以下时，重生时间不变。
#                     玩家数量超过配置值时，重生时间按比例减少
#                     （例如，玩家数量翻倍时，重生时间减半；玩家数量增至三倍时，重生时间缩短至三分之一）。
#                     不影响实例生物、首领或任务目标。
#                     公式：调整因子 = 速率 / 玩家数量
#                              重生时间 = 重生时间 × 调整因子
#        Default:     1 （禁用）

Respawn.DynamicRateCreature = 1

