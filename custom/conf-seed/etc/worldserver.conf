#    OUTDOORPVP
#    WINTERGRASP
#    BATTLEGROUND
#    ARENA
#    MAIL
#    TRANSPORT
#    CHAT CHANNEL
#    FACTION INTERACTION
#    RECRUIT A FRIEND
#    CALENDAR
#    GAME EVENT
#    AUCTION HOUSE
#    PLAYER DUMP
#    CUSTOM
#    DEBUG
#    DYNAMIC RESPAWN SETTINGS
#
#  CLUSTER SETTINGS
