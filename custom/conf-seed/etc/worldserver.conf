###################################################################################################

###################################################################################################
#                                                                                                 #
# SERVER SYSTEM SETTINGS BEGIN                                                                    #
#                                                                                                 #
###################################################################################################

###################################################################################################
# DATABASE & CONNECTIONS
#
#    RealmID
#        说明：此配置项用于指定使用此配置文件的服务器的Realm ID。
#        重要提示：RealmID 必须与 auth 数据库中的 realmlist 一致。
#        默认值：1

RealmID = 1

#
#    WorldServerPort
#        说明：用于指定世界服务器的 TCP 端口。
#        默认值：8085

WorldServerPort = 8085

#
#    BindIP
#        说明：用于指定世界服务器绑定的 IP 地址或主机名。
#        默认值："0.0.0.0" - （绑定到系统上的所有 IP 地址）

BindIP = "0.0.0.0"

#
#    LoginDatabaseInfo
#    WorldDatabaseInfo
#    CharacterDatabaseInfo
#        说明：用于指定世界服务器的数据库连接设置。
#        示例："hostname;port;username;password;database"
#             ".;somenumber;username;password;database" - （在 Windows 上使用命名管道
#                                                          需在 my.ini 的 [mysqld]
#                                                          部分添加 "enable-named-pipe"）
#             ".;/path/to/unix_socket;username;password;database" - （在 Unix/Linux 上使用 Unix 套接字）
#        默认值："127.0.0.1;3306;acore;acore;acore_auth"       - （LoginDatabaseInfo）
#                 "127.0.0.1;3306;acore;acore;acore_world"      - （WorldDatabaseInfo）
#                 "127.0.0.1;3306;acore;acore;acore_characters" - （CharacterDatabaseInfo）

LoginDatabaseInfo     = "127.0.0.1;3306;acore;acore;acore_auth"
WorldDatabaseInfo     = "127.0.0.1;3306;acore;acore;acore_world"
CharacterDatabaseInfo = "127.0.0.1;3306;acore;acore;acore_characters"

#
#    LoginDatabase.WorkerThreads
#    WorldDatabase.WorkerThreads
#    CharacterDatabase.WorkerThreads
#        说明：用于指定处理异步 MySQL 语句的线程数。每个工作线程对应一个 MySQL 服务器的连接。
#        默认值：1 - （LoginDatabase.WorkerThreads）
#                 1 - （WorldDatabase.WorkerThreads）
#                 1 - （CharacterDatabase.WorkerThreads）

LoginDatabase.WorkerThreads     = 1
WorldDatabase.WorkerThreads     = 1
CharacterDatabase.WorkerThreads = 1

#
#    LoginDatabase.SynchThreads
#    WorldDatabase.SynchThreads
#    CharacterDatabase.SynchThreads
#        说明：用于指定数据库连接数。
#        默认值：1 - （LoginDatabase.SynchThreads）
#                 1 - （WorldDatabase.SynchThreads）
#                 1 - （CharacterDatabase.SynchThreads）

LoginDatabase.SynchThreads     = 1
WorldDatabase.SynchThreads     = 1
CharacterDatabase.SynchThreads = 1

#
#    MaxPingTime
#        说明：用于指定数据库 ping 操作的时间间隔（以分钟为单位）。
#        默认值：30

MaxPingTime = 30

#
#    Database.Reconnect.Seconds
#    Database.Reconnect.Attempts
#
#        说明：用于指定重新连接尝试的时间间隔（以秒为单位）和尝试次数。
#        默认值：每 15 秒尝试一次，共尝试 20 次

Database.Reconnect.Seconds = 15
Database.Reconnect.Attempts = 20

#
###################################################################################################

###################################################################################################
# DIRECTORIES
#
#    DataDir
#        说明：用于指定数据目录。
#        重要提示：DataDir 需要加引号，因为路径中可能包含空格。
#        示例： "@prefix@\home\youruser\azerothcore\data"
#        默认值："." - （当前目录）

DataDir = "."

#
#    LogsDir
#        说明：用于指定日志目录。
#        重要提示：LogsDir 需要加引号，因为路径中可能包含空格。
#                 日志目录必须存在，否则无法创建日志文件。
#        示例： "/home/youruser/azerothcore/logs"
#        默认值："" - （日志文件将存储在当前路径下）

LogsDir = ""

#
#    TempDir
#        说明：用于指定临时目录。
#        重要提示：TempDir 需要加引号，因为路径中可能包含空格。
#                 临时目录必须存在，否则服务器可能无法正常工作。
#        示例： "/home/youruser/azerothcore/temp"
#        默认值："" - （临时文件将存储在当前路径下）

TempDir = ""

#
#    CMakeCommand
#        说明：用于指定 CMake 可执行文件的路径。
#             如果路径为空，则使用内置的 CMAKE_COMMAND。
#        示例： "C:/Program Files/CMake/bin/cmake.exe"
#               "/usr/bin/cmake"
#        默认值： ""

CMakeCommand = ""

#
#    BuildDirectory
#        说明：用于指定构建目录的路径。
#             如果路径为空，则使用内置的 CMAKE_BINARY_DIR。
#        示例： "../AzerothCore"
#        默认值： ""

BuildDirectory = ""

#
#    SourceDirectory
#        说明：用于指定 AzerothCore 源代码目录的路径。
#             如果路径为空，则使用内置的 CMAKE_SOURCE_DIR。
#        示例： "../azerothcore-wotlk"
#        默认值： ""

SourceDirectory = ""

#
#    MySQLExecutable
#        说明：用于指定 MySQL CLI 可执行文件的路径。
#             如果路径为空，则使用 cmake 内置的路径。
#        示例： "C:/Program Files/MySQL/MySQL Server 8.0/bin/mysql.exe"
#               "mysql.exe"
#               "/usr/bin/mysql"
#        默认值： ""

MySQLExecutable = ""

#
#    PidFile
#        说明：用于指定世界守护进程的 PID 文件。
#        示例： "./world.pid" - （启用）
#        默认值： ""            - （禁用）

PidFile = ""

#
###################################################################################################

###################################################################################################
# CONSOLE
#
#    Console.Enable
#        说明：用于启用或禁用控制台。
#        默认值：1 - （启用）
#                0 - （禁用）

Console.Enable = 1

#
#    BeepAtStart
#        说明：在世界服务器启动完成后发出提示音（仅适用于 Unix/Linux 系统）。
#        默认值：1 - （启用）
#                0 - （禁用）

BeepAtStart = 1

#
#    FlashAtStart
#        说明：在世界服务器启动完成后使任务栏图标闪烁（仅适用于 Windows 系统）。
#        默认值：1 - （启用）
#                0 - （禁用）

FlashAtStart = 1

#
###################################################################################################

###################################################################################################
# AUTOUPDATER
#
#    Updates.EnableDatabases
#        说明：用于指定需要更新的数据库。
#             可用的标志如下：
#                DATABASE_LOGIN     = 1, // 认证数据库
#                DATABASE_CHARACTER = 2, // 角色数据库
#                DATABASE_WORLD     = 4  // 世界数据库
#        默认值：7  - （启用所有数据库更新）
#                4  - （仅启用世界数据库更新）
#                0  - （禁用所有数据库更新）

Updates.EnableDatabases = 7

#
#    Updates.AutoSetup
#        说明：用于自动填充空数据库。
#        默认值：1 - （启用）
#                0 - （禁用）

Updates.AutoSetup   = 1

#
#    Updates.Redundancy
#        说明：用于通过哈希校验检测 SQL 更新中的数据冗余并重新应用更新。
#        默认值：1 - （启用）
#                0 - （禁用）

Updates.Redundancy  = 1

#
#    Updates.ArchivedRedundancy
#        说明：用于检查归档更新的哈希值（会降低启动速度）。
#        默认值：0 - （禁用）
#                1 - （启用）

Updates.ArchivedRedundancy = 0

#
#    Updates.AllowRehash
#        说明：如果文件哈希为空，将其当前文件哈希插入数据库。
#             如果您希望标记文件为已应用但不知道其哈希值，此设置会很有用。
#        默认值：1 - （启用）
#                0 - （禁用）

Updates.AllowRehash = 1

#
#    Updates.CleanDeadRefMaxCount
#        说明：用于清理因更新被移除或重命名而产生的孤立引用。
#             仅在缺失更新的计数小于或等于 Updates.CleanDeadRefMaxCount 值时才开始清理。
#             这样可以防止由于源目录状态错误（例如使用了错误的分支或修订版本）而导致数据库处于“脏”状态。
#             禁用此功能可以了解数据库是否处于可能的“脏”状态。
#        默认值：3 - （启用）
#                0 - （禁用）
#                -1 - （启用 - 无限制）

Updates.CleanDeadRefMaxCount = 3

#
#    Updates.ExceptionShutdownDelay
#        说明：发生致命异常（例如 SQL 更新失败）后，等待多少毫秒再关闭服务器。（自行补译）
#        默认值：10000 - 10 秒
#                     0     - 禁用（立即关闭）

Updates.ExceptionShutdownDelay = 10000

#
###################################################################################################

###################################################################################################
# NETWORK
#
#    Network.Threads
#        说明：用于指定网络线程数。
#         默认值：1 - （推荐每 1000 个连接使用 1 个线程）

Network.Threads = 1

#
#    Network.OutKBuff
#        说明：用于指定输出内核缓冲区的大小（以字节为单位）。
#              （参见 SO_SNDBUF 套接字选项，TCP 手册）。
#        默认值：-1 - （使用系统默认设置）

Network.OutKBuff = -1

#
#    Network.OutUBuff
#        说明：用于指定每个连接初始保留的用户空间输出缓冲区大小（以字节为单位）。
#         默认值：4096

Network.OutUBuff = 4096

#
#    Network.TcpNoDelay:
#        说明：用于设置 TCP Nagle 算法。
#         默认值：0 - （启用，较少流量，较高延迟）
#                 1 - （禁用，较多流量，较低延迟，TCP_NO_DELAY）

Network.TcpNodelay = 1

#
#    Network.EnableProxyProtocol
#        说明：如果您的服务器位于代理、负载均衡器或类似组件之后，需要启用 Proxy Protocol v2。
#              您需要在服务器和代理/负载均衡器上都启用 Proxy Protocol v2，以便跟踪玩家的真实 IP 地址。
#        示例：1 - （启用）
#        默认值：0 - （禁用）

Network.EnableProxyProtocol = 0

#
#    Network.UseSocketActivation
#        说明：[仅限 Linux] 为 worldserver 启用 systemd socket activation 支持。启用后，若进程由 systemd 的 socket activation 启动，服务器将使用 systemd 传入的套接字，而不再自行创建并绑定监听套接字。默认禁用；启用时关服不会自动将 Realm 置为离线。（自行补译）
#        示例：     1 - （启用）
#        默认值：     0 - （禁用）

Network.UseSocketActivation = 0

#
###################################################################################################

###################################################################################################
# REMOTE ACCESS
#
#    Ra.Enable
#        说明：用于启用远程控制台（telnet）。
#        默认值：0 - （禁用）
#                1 - （启用）

Ra.Enable = 0

#
#    Ra.IP
#        说明：用于指定远程控制台绑定的 IP 地址或主机名。
#        默认值："0.0.0.0" - （绑定到系统上的所有 IP 地址）

Ra.IP = "0.0.0.0"

#
#    Ra.Port
#        说明：用于指定远程控制台的 TCP 端口。
#        默认值：3443

Ra.Port = 3443

#
#    Ra.MinLevel
#        说明：使用远程控制台所需的最低安全级别。
#        默认值：3

Ra.MinLevel = 3

#
#    SOAP.Enable
#        说明：用于启用 SOAP 服务。
#        默认值：0 - （禁用）
#                1 - （启用）

SOAP.Enabled = 0

#
#    SOAP.IP
#        说明：用于指定 SOAP 服务绑定的 IP 地址或主机名。
#        默认值："127.0.0.1" - （绑定到本地主机）

SOAP.IP = "127.0.0.1"

#
#    SOAP.Port
#        说明：用于指定 SOAP 服务的 TCP 端口。
#        默认值：7878

SOAP.Port = 7878

#
###################################################################################################

###################################################################################################
# CRYPTOGRAPHY
#
#    TOTPMasterSecret
#        说明：用于认证服务器解密数据库中存储的 TOTP 密钥的密钥。
#             如果您计划使用游戏内的 2FA 管理命令（.account 2fa），您需要在此处设置此密钥。
#             否则，可以将其留空。
#
#             如果此设置与认证服务器中的设置不匹配，服务器会自动检测到此问题，
#             并且依赖于该密钥的任何命令将被禁用。
#
#        默认值：<空白>

TOTPMasterSecret =

#
###################################################################################################

###################################################################################################
# PERFORMANCE
#
#    ThreadPool
#        说明：用于指定全局线程池中使用的线程数。
#              线程池目前用于以下功能：
#               - 信号处理
#               - 远程访问
#               - 数据库保持活动状态的 ping
#               - 核心冻结检测
#               - 世界套接字网络
#        默认值：2

ThreadPool = 2

#
#    UseProcessors
#        说明：用于指定 Windows 和 Linux 基于多处理器系统的处理器掩码。
#        示例：对于一台有 3 个 CPU 的计算机：
#                 1 - 仅使用第 1 个 CPU
#                 2 - 仅使用第 2 个 CPU
#                 4 - 仅使用第 3 个 CPU
#                 6 - 使用第 2 个和第 3 个 CPU（因为 "2 | 4" = 6）
#        默认值：0  - （由操作系统选择）
#                 1+ - （处理器掩码值）

UseProcessors = 0

#
#    ProcessPriority
#        说明：用于设置 Windows 系统的进程优先级。
#        默认值：1 - （高）
#                0 - （正常）

ProcessPriority = 1

#
#    Compression
#        说明：用于设置客户端更新包的压缩级别。
#        范围：1-9
#        默认值：1   - （速度优先）
#                 9   - （最佳压缩）

Compression = 1

#
###################################################################################################

###################################################################################################
# LOGGING
#
#    PacketLogFile
#        说明：用于指定世界服务器的二进制数据包日志文件。
#              文件扩展名必须为 .pkt，才能使用 WowPacketParser 进行解析。
#        示例： "World.pkt" - （启用）
#        默认值： ""          - （禁用）

PacketLogFile = ""

#
#    LogDB.Opt.ClearInterval
#        说明：用于指定清除日志表中旧条目的 WUPDATE_CLEANDB 定时器的时间间隔（以分钟为单位）。
#        默认值：10 - （10 分钟）
#                 1+

LogDB.Opt.ClearInterval = 10

#
#    LogDB.Opt.ClearTime
#        说明：用于指定保留日志表中旧条目的时间（以秒为单位）。
#        默认值：1209600 - （启用，14 天）
#                 0       - （禁用，不删除条目）

LogDB.Opt.ClearTime = 1209600

#
#    RecordUpdateTimeDiffInterval
#        说明：用于指定将更新时间差写入日志文件的时间间隔（以毫秒为单位）。
#              更新时间差可以用作性能指标。差值 < 300 表示性能良好，
#              差值 > 600 表示性能较差，可能是由于 CPU 使用率过高。
#        默认值：300000 - （启用，5 分钟）
#                 0      - （禁用）

RecordUpdateTimeDiffInterval = 300000

#
#     MinRecordUpdateTimeDiff
#        说明：仅记录大于此值的更新时间差。
#        默认值：100

MinRecordUpdateTimeDiff = 100

#
#    IPLocationFile
#        说明：用于指定 IP2Location 数据库 CSV 文件的路径。
#        示例： "C:/acore/IP2LOCATION-LITE-DB1.CSV"
#               "/home/acore/IP2LOCATION-LITE-DB1.CSV"
#        默认值： ""  - （禁用）

IPLocationFile = ""

#
#    AllowLoggingIPAddressesInDatabase
#        说明：用于指定是否允许在数据库中记录 IP 地址。
#        默认值：1 - （启用）
#                0 - （禁用）

AllowLoggingIPAddressesInDatabase = 1

#
#    Allow.IP.Based.Action.Logging
#        说明：用于指定是否基于 IP 地址记录操作日志，例如账户登录和注销等。
#        默认值：0 - （禁用）
#                1 - （启用）

Allow.IP.Based.Action.Logging = 0

#
#    LogSpamReports
#        说明：是否将玩家在聊天、邮件或日历中的刷屏举报记录写入数据库。（自行补译）
#        默认值：     1 - （启用）
#                     0 - （禁用）

LogSpamReports = 1

#
#    ChatLog.Enable
#        说明：启用或禁用聊天记录日志（chat_log.cpp）。（自行补译）
#        默认值：     0 - （禁用）
#                     1 - （启用）

ChatLog.Enable = 0

#
#    Appender config values: Given an appender "name"
#    Appender.name
#        说明：定义 “日志记录位置”。
#        格式：类型,日志级别,标志,可选1,可选2,可选3
#
#                     类型
#                         0 - （无）
#                         1 - （控制台）
#                         2 - （文件）
#                         3 - （数据库）
#
#                     日志级别
#                         0 - （禁用）
#                         1 - （严重）
#                         2 - （错误）
#                         3 - （警告）
#                         4 - （信息）
#                         5 - （调试）
#                         6 - （跟踪）
#
#                     标志：
#                         0 - 无
#                         1 - 在文本前添加时间戳
#                         2 - 在文本前添加日志级别
#                         4 - 在文本前添加日志过滤器类型
#                         8 - 在日志文件名后追加时间戳。格式：YYYY-MM-DD_HH-MM-SS
#                             （仅用于类型 = 文件）
#                        16 - 在覆盖文件前创建备份
#                             （仅用于模式 = w）
#
#                     颜色（如果类型 = 控制台，则作为可选1 读取）
#                         格式： "严重 错误 警告 信息 调试 跟踪"
#                         0 - 黑色
#                         1 - 红色
#                         2 - 绿色
#                         3 - 棕色
#                         4 - 蓝色
#                         5 - 紫色
#                         6 - 青色
#                         7 - 灰色
#                         8 - 黄色
#                         9 - 浅红色
#                        10 - 浅绿色
#                        11 - 浅蓝色
#                        12 - 浅紫色
#                        13 - 浅青色
#                        14 - 白色
#                         示例： "1 9 3 6 5 8"
#
#                     文件：日志文件的名称（如果类型 = 文件，则作为可选1 读取）
#                         允许使用一个 "%s" 创建动态文件名
#
#                     模式：打开文件的模式（如果类型 = 文件，则作为可选2 读取）
#                          a - （追加）
#                          w - （覆盖）
#
#                     最大文件大小：日志文件的最大大小（如果类型 = 文件，则作为可选3 读取）
#                         以字节为单位的无符号 64 位整数。
#                         最大值为 4294967295（4 GB）。留空表示无限制。
#                         注意：不支持动态文件名。
#                         示例： 536870912（512 MB）

Appender.Console=1,4,0,"1 9 3 6 5 8"
Appender.Server=2,5,0,Server.log,w
Appender.Playerbots=2,5,0,Playerbots.log,w
# Appender.GM=2,5,15,gm_%s.log
Appender.Errors=2,2,0,Errors.log,w
# Appender.DB=3,5,0
# Appender.Dev=2,5,0,Dev.log,a

#    Logger config values: Given a logger "name"
#    Logger.name
#        说明：定义 “日志记录内容”。
#        格式：日志级别,Appender 列表
#
#                     日志级别
#                         0 - （禁用）
#                         1 - （严重）
#                         2 - （错误）
#                         3 - （警告）
#                         4 - （信息）
#                         5 - （调试）
