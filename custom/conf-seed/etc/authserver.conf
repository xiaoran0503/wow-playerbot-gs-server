###############################################
# AzerothCore Auth Server configuration file #
###############################################
[authserver]

###################################################################################################
# SECTION INDEX
#
#    EXAMPLE CONFIG
#    AUTH SERVER SETTINGS
#    MYSQL SETTINGS
#    CRYPTOGRAPHY
#    UPDATE SETTINGS
#    LOGGING SYSTEM SETTINGS
#    NETWORK
#
###################################################################################################

###################################################################################################
# EXAMPLE CONFIG
#
#    Variable
#        Description: Brief description what the variable is doing.
#        Important:   Annotation for important things about this variable.
#        Example:     "Example, i.e. if the value is a string"
#        Default:     10 - (Enabled|Comment|Variable name in case of grouped config options)
#                     0  - (Disabled|Comment|Variable name in case of grouped config options)
#
# Note to developers:
# - Copy this example to keep the formatting.
# - Line breaks should be at column 100.
###################################################################################################

###################################################################################################
# AUTH SERVER SETTINGS
#
#    LogsDir
#        说明：日志目录设置。（自行补译）
#        重要提示：   LogsDir 需要加引号，因为路径可能包含空格。日志目录必须存在，否则将禁用日志文件创建。
#        示例：     "/home/youruser/azerothcore/logs"
#        默认值：     "" - （日志文件将存储在当前路径）

LogsDir = ""

#
#    MaxPingTime
#        说明：数据库心跳间隔时间（分钟）。（自行补译）
#        默认值：     30

MaxPingTime = 30

#
#    RealmServerPort
#        说明：连接 authserver 的 TCP 端口。（自行补译）
#        默认值：     3724

RealmServerPort = 3724

#
#
#    BindIP
#        说明：将 authserver 绑定到指定 IP/主机名。（自行补译）
#        默认值：     "0.0.0.0" - （绑定到系统上的所有 IP）

BindIP = "0.0.0.0"

#
#    EnableProxyProtocol
#        说明：启用 Proxy Protocol v2。当服务器位于代理、负载均衡器或类似组件之后时，需要在本服务器与代理/负载均衡器双方都启用 Proxy Protocol v2，才能追踪玩家真实 IP。（自行补译）
#        示例：     1 - （启用）
#        默认值：     0 - （禁用）

EnableProxyProtocol = 0

#
#    PidFile
#        说明：authserver 的 PID 文件路径。（自行补译）
#        示例：     "./authserver.pid"  - （启用）
#        默认值：     ""                  - （禁用）

PidFile = ""

#
#    UseProcessors
#        说明：Windows 与 Linux 多处理器系统的处理器掩码。（自行补译）
#        示例：  假设计算机有 3 个 CPU：
#                     1 - 仅第 1 个 CPU
#                     2 - 仅第 2 个 CPU
#                     4 - 仅第 3 个 CPU
#                     6 - 第 2 + 第 3 个 CPU，因为 "2 | 4" = 6
#        默认值：     0  - （由操作系统选择）
#                     1+ - （所选处理器的位掩码值）

UseProcessors = 0

#
#    ProcessPriority
#        说明：Windows 与 Linux 系统的进程优先级设置。（自行补译）
#        详细说明：     Linux 下使用 nice 值 -15（需要超级用户权限）；Windows 下进程设为 HIGH 优先级类。
#        默认值：     0 - （普通）
#                     1 - （高）

ProcessPriority = 0

#
#    RealmsStateUpdateDelay
#        说明：Realm 列表更新间隔时间（秒）。（自行补译）
#        默认值：     20 - （启用）
#                     0  - （禁用）

RealmsStateUpdateDelay = 20

#
#    WrongPass.MaxCount
#        说明：密码错误登录尝试达到此次数后，封禁账号或 IP。（自行补译）
#        默认值：     0  - （禁用）
#                     1+ - （启用）

WrongPass.MaxCount = 0

#
#    WrongPass.BanTime
#        说明：因无效登录尝试封禁账号或 IP 的时长（秒）。（自行补译）
#        默认值：     600 - （10 分钟）
#                     0   - （永久封禁）

WrongPass.BanTime = 600

#
#    WrongPass.BanType
#        说明：无效登录尝试的封禁类型。（自行补译）
#        默认值：     0 - （封禁 IP）
#                     1 - （封禁账号）

WrongPass.BanType = 0

#
#    WrongPass.Logging
#        说明：额外记录密码错误的登录尝试日志。（自行补译）
#        默认值：     0 - （禁用）
#                     1 - （启用）

WrongPass.Logging = 0

#
#    BanExpiryCheckInterval
#        说明：过期封禁的检查间隔（秒）。（自行补译）
#        默认值：     60

BanExpiryCheckInterval = 60

#
#    StrictVersionCheck
#        说明：阻止被修改过的客户端连接。（自行补译）
#        默认值：     0 - （禁用）
#                     1 - （启用）

StrictVersionCheck = 0

#
#    SourceDirectory
#        说明：AzerothCore 源码目录路径。留空则使用内置的 CMAKE_SOURCE_DIR。（自行补译）
#        示例：     "../AzerothCore"
#        默认值：     ""
#
#        留空会回落到编译机器上的 CMAKE_SOURCE_DIR，搬到别的机器后必然不存在，
#        日志会报 "DBUpdater: The given source directory ... does not exist"。
#        Windows 一键包把 data\ 放在 exe 同级，写 "." 即可（相对工作目录）。

SourceDirectory = "."

#
#    MySQLExecutable
#        说明：MySQL CLI 客户端二进制路径。数据库自动更新功能会调用该程序导入 .sql，
#             因此必须指向一个真实存在的 mysql.exe。
#
#             【重要】留空时服务器只会在系统 PATH 中查找 mysql。Windows 一键包把 MySQL
#             放在 <解压目录>\mysql\bin\ 下（不在 PATH 里），所以必须显式填写本包内路径，
#             否则数据库更新器找不到 CLI 会报错退出。
#
#             本包（Windows 一键包）请填写：
#               "./mysql/bin/mysql.exe"
#             完整路径也可以，例如：
#               "C:/Program Files/MySQL/MySQL Server 8.4/bin/mysql.exe"
#               "/usr/bin/mysql"
#
#        默认值：     ""
#
#        提示：路径写错时，服务器会在启动阶段报
#              "Didn't find any executable MySQL binary at ..." 并停止启动，
#              而不是静默跳过数据库更新——这是有意为之，避免数据库结构半更新。
#

MySQLExecutable = "./mysql/bin/mysql.exe"

#
#    TempDir
#        说明：临时目录设置。（自行补译）
#        重要提示：   TempDir 需要加引号，因为路径可能包含空格。临时目录必须存在，否则服务器无法正常工作。
#        示例：     "/home/youruser/azerothcore/temp"
#        默认值：     "" - （临时文件将存储在当前路径）

TempDir = ""

#
#    IPLocationFile
#        说明：IP2Location 数据库 CSV 文件路径。（自行补译）
#        示例：     "C:/acore/IP2LOCATION-LITE-DB1.CSV"
#                     "/home/acore/IP2LOCATION-LITE-DB1.CSV"
#        默认值：     ""  - （禁用）

IPLocationFile = ""

#
#    AllowLoggingIPAddressesInDatabase
#        说明：是否允许将 IP 地址记录到数据库。（自行补译）
#        默认值：     1 - （启用）
#                     0 - （禁用）

AllowLoggingIPAddressesInDatabase = 1

#
###################################################################################################

###################################################################################################
# MYSQL SETTINGS
#
#    LoginDatabaseInfo
#        说明：Realm 服务器的数据库连接设置。（自行补译）
#        示例：     "hostname;port;username;password;database"
#                     ".;somenumber;username;password;database" - （Windows 上使用命名管道，
#                                                                 "enable-named-pipe" 需加到 my.ini 的 [mysqld] 段）
#                     ".;/path/to/unix_socket;username;password;database" - （Unix/Linux 上使用 Unix 套接字）
#        默认值：     "127.0.0.1;3306;acore;acore;acore_auth"

LoginDatabaseInfo = "127.0.0.1;3306;acore;acore;acore_auth"

#
#    Database.Reconnect.Seconds
#    Database.Reconnect.Attempts
#        说明：每次重连尝试之间的秒数，以及总共尝试次数。（自行补译）
#        默认值：     每 15 秒尝试 20 次

Database.Reconnect.Seconds = 15
Database.Reconnect.Attempts = 20

#
#    LoginDatabase.WorkerThreads
#        说明：处理异步（延迟）MySQL 语句的工作线程数。每个工作线程都镜像一条自己的数据库连接。（自行补译）
#        默认值：     1

LoginDatabase.WorkerThreads = 1

#
#    LoginDatabase.SynchThreads
#        说明：用于处理 MySQL 的同步连接数。（自行补译）
#        默认值：     1 - （对应 LoginDatabase.WorkerThreads）

LoginDatabase.SynchThreads = 1

#
###################################################################################################

###################################################################################################
# CRYPTOGRAPHY

#
#    TOTPMasterSecret
#        说明：用于加密数据库中存储的 TOTP 密钥的主密钥。如需更换：取消注释 TOTPOldMasterSecret，把旧密钥填进去并启动一次 authserver；之后再注释掉该行并移除旧密钥。（自行补译）
#        默认值：     <blank> - （不加密存储 TOTP 密钥）
#        示例：     000102030405060708090A0B0C0D0E0F

TOTPMasterSecret =
# TOTPOldMasterSecret =

#
###################################################################################################

###################################################################################################
# UPDATE SETTINGS
#
#    Updates.EnableDatabases
#        说明：位掩码，指定需要更新哪些数据库。（自行补译）
#        可用标志：
#           DATABASE_LOGIN     = 1, // Auth 数据库
#        默认值：     0  - （全部禁用）
#                     1  - （全部启用）

Updates.EnableDatabases = 1

#
#    Updates.AutoSetup
#        说明：自动填充空数据库。（自行补译）
#        默认值：     1 - （启用）
#                     0 - （禁用）

Updates.AutoSetup = 1

#
#    Updates.Redundancy
#        说明：通过哈希校验检测 SQL 更新中的数据冗余并重新应用更新。（自行补译）
#        默认值：     1 - （启用）
#                     0 - （禁用）

Updates.Redundancy = 1

#
#    Updates.ArchivedRedundancy
#        说明：校验归档更新的哈希值（会拖慢启动）。（自行补译）
#        默认值：     0 - （禁用）
#                     1 - （启用）

Updates.ArchivedRedundancy = 0

#
#    Updates.AllowRehash
#        说明：若数据库中哈希为空，则写入当前文件哈希。适合想把某文件标记为已应用但不知道其哈希的情况。（自行补译）
#        默认值：     1 - （启用）
#                     0 - （禁用）

Updates.AllowRehash = 1

#
#    Updates.CleanDeadRefMaxCount
#        说明：清理“死/孤儿”引用（发生于更新被删除或重命名后又在同一编辑步骤中修改时）。仅当缺失更新数量 ≤ Updates.CleanDeadRefMaxCount 时才执行清理，防止因源码目录状态错误（错误分支或坏版本）误删更新历史。若想知道数据库是否处于“脏状态”，请禁用此项。（自行补译）
#        默认值：     3 - （启用）
#                     0 - （禁用）
#                    -1 - （启用，不限制次数）

Updates.CleanDeadRefMaxCount = 3
###################################################################################################

###################################################################################################
#
#  LOGGING SYSTEM SETTINGS
#
#  Appender config values: Given an appender "name"
#    Appender.name
#        说明：定义“日志输出到哪里”。（自行补译）
#        格式：      Type,LogLevel,Flags,optional1,optional2,optional3
#
#                     Type（类型）
#                         0 - （无）
#                         1 - （控制台）
#                         2 - （文件）
#                         3 - （数据库）
#
#                     LogLevel（日志级别）
#                         0 - （禁用）
#                         1 - （Fatal 致命）
#                         2 - （Error 错误）
#                         3 - （Warning 警告）
#                         4 - （Info 信息）
#                         5 - （Debug 调试）
#                         6 - （Trace 跟踪）
#
#                     Flags（标志）：
#                         0 - 无
#                         1 - 文本前加时间戳
#                         2 - 文本前加日志级别
#                         4 - 文本前加日志过滤器类型
#                         8 - 日志文件名后追加时间戳，格式 YYYY-MM-DD_HH-MM-SS（仅 Type = 2 文件时）
#                        16 - 覆盖文件前创建备份（仅 Mode = w 时）
#
#                     Colors（颜色，Type = 控制台时作为 optional1 读取）
#                         格式："fatal error warn info debug trace"
#                         0 - 黑色
#                         1 - 红色
#                         2 - 绿色
#                         3 - 棕色
#                         4 - 蓝色
#                         5 - 紫色
#                         6 - 青色
#                         7 - 灰色
#                         8 - 黄色
#                         9 - 浅红
#                        10 - 浅绿
#                        11 - 浅蓝
#                        12 - 浅紫
#                        13 - 浅青
#                        14 - 白色
#                         示例： "1 9 3 6 5 8"
#
#                     File（文件）：日志文件名（Type = 文件时作为 optional1 读取）
#                         允许使用一个 "%s" 创建动态文件名
#
#                     Mode（模式）：打开文件的模式（Type = 文件时作为 optional2 读取）
#                          a - （追加）
#                          w - （覆盖）
#
#                     MaxFileSize（最大文件大小）：创建新日志文件前的最大大小（Type = 文件时作为 optional3 读取）
#                         以字节为单位的 64 位无符号整数。
#                         最大值 4294967295（4 GB）。留空表示无限制。
#                         注意：不支持动态文件名。
#                         示例：  536870912（512 MB）

Appender.Console=1,5,0,"1 9 3 6 5 8"
Appender.Auth=2,5,0,Auth.log,w

#  Logger config values: Given a logger "name"
#    Logger.name
#        说明：定义“记录什么”。（自行补译）
#        格式：      LogLevel,AppenderList
#
#                     LogLevel（日志级别）
#                         0 - （禁用）
#                         1 - （Fatal 致命）
#                         2 - （Error 错误）
#                         3 - （Warning 警告）
#                         4 - （Info 信息）
#                         5 - （Debug 调试）
#                         6 - （Trace 跟踪）
#
#                     AppenderList（输出器列表）：链接到 logger 的 appender 列表
#                     （以空格分隔）。

Logger.root=4,Console Auth

#
###################################################################################################

###################################################################################################
# NETWORK
#
#    Network.UseSocketActivation
#        说明：[仅限 Linux] 为 authserver 启用 systemd socket activation 支持。启用后，若进程由 systemd 的 socket activation 启动，服务器将使用 systemd 传入的套接字，而不再自行创建并绑定监听套接字。默认禁用。（自行补译）
#        示例：     1 - （启用）
#        默认值：     0 - （禁用）

Network.UseSocketActivation = 0

#
###################################################################################################
