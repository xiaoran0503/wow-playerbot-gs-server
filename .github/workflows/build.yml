name: build-push

# 触发矩阵：
#   push main          —— 推送到主干自动编译（本机不编译，一切在 GitHub Actions 完成）
#   workflow_dispatch  —— 手动触发（仓库 Actions 页面点 "Run workflow"）
#   schedule           —— 每日 02:00 UTC 定时重建（北京时间 10:00），cron 为 5 段
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

# 镜像命名前缀 = Docker Hub 命名空间，取自仓库 Secret DOCKERHUB_USERNAME
# 最终镜像：docker.io/<你的DockerHub用户名>/wow-<authserver|worldserver|db-import>
# 需要在仓库 Settings → Secrets and variables → Actions 配置两个 Secret：
#   DOCKERHUB_USERNAME  —— Docker Hub 用户名
#   DOCKERHUB_TOKEN     —— Docker Hub 访问令牌（Access Token，不是登录密码）
env:
  IMAGE_BASE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}
  # GitHub Actions 限制：`if:` 条件不能直接引用 secrets 上下文，
  # 故在 env（允许 secrets）里先求值，供步骤 if/bash 使用。
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 必须 fetch-depth: 0（完整历史）：docker/Dockerfile 内 genrev 要从 git
      # 提交历史生成编译版本信息，浅克隆会导致 genrev 报错或版本号为空。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docker Buildx：支持多阶段构建、缓存导出、--push 直推仓库
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 Docker Hub；凭据来自上面两个 Secret。
      # 未配置 DOCKERHUB_* secrets 时跳过（改走"导出 tar artifact"分支），不让 CI 卡死在登录。
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 计算统一 tag：UTC日期-Git提交短sha8（YYYYMMDD-<sha8>），供后续步骤复用
      - name: Compute tag
        id: tag
        shell: bash
        run: |
          echo "value=$(date -u +%Y%m%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # 三目标多阶段构建：docker/Dockerfile 内
      #   skeleton(基础层) → build(编译核心+modules/ 下 6 个 vendor 模块) → runtime(运行时)
      #   → authserver / worldserver / db-import
      # cache gha 双向：cache-from 读上次构建缓存，cache-to mode=max 写回 Actions 缓存，
      # 大幅加速重复编译（模块很少全量重编）。
      # 模式分流：
      #   已配 DOCKERHUB secrets → --push 直推 Docker Hub，打 日期-sha8 + latest 双 tag；
      #   未配 secrets → 构建镜像并导出为 images/wow-<target>-<tag>.tar 上传 artifact
      #   （本机 docker load 即可用），镜像不丢失，只是暂不发布到 Docker Hub。
      - name: Build & push (authserver / worldserver / db-import)
        shell: bash
        run: |
          set -euxo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          if [ "$HAS_DOCKERHUB" == "true" ]; then
            for target in authserver worldserver db-import; do
              docker buildx build \
                --push \
                --target "$target" \
                -f docker/Dockerfile \
                -t "$IMAGE_BASE/wow-$target:$TAG" \
                -t "$IMAGE_BASE/wow-$target:latest" \
                --cache-from type=gha \
                --cache-to type=gha,mode=max \
                .
            done
          else
            mkdir -p images
            for target in authserver worldserver db-import; do
              docker buildx build \
                --target "$target" \
                -f docker/Dockerfile \
                -t "local/wow-$target:$TAG" \
                --cache-from type=gha \
                --cache-to type=gha,mode=max \
                --output type=docker,dest="images/wow-$target-$TAG.tar" \
                .
            done
          fi

      # 无 DOCKERHUB secrets 时的镜像 tar 导出（有 secrets 时本步不产出，跳过）
      - name: Upload exported image tars (no-secrets fallback)
        if: env.HAS_DOCKERHUB != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wow-images-tar
          path: images/*.tar
          if-no-files-found: error

      # 审计用：把本次构建的镜像清单写成文件并上传为 artifact，
      # 方便本机 wslc-mirror 部署时核对该拉哪个 tag。
      - name: Write image manifest
        shell: bash
        run: |
          {
            echo "# built at $(date -u --iso-8601=seconds)"
            echo "sha=${GITHUB_SHA}"
            echo "tag=${{ steps.tag.outputs.value }}"
            if [ "$HAS_DOCKERHUB" == "true" ]; then
              echo "mode=push-dockerhub"
              for target in authserver worldserver db-import; do
                echo "${IMAGE_BASE}/wow-$target:${{ steps.tag.outputs.value }}"
              done
            else
              echo "mode=export-tar (DOCKERHUB secrets not configured; artifacts: wow-images-tar)"
              for target in authserver worldserver db-import; do
                echo "images/wow-$target-${{ steps.tag.outputs.value }}.tar"
              done
            fi
          } > image-manifest.txt

      - name: Upload image manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest
          path: image-manifest.txt
